services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    # Portainer CE repository stacks do not apply the UI environment rows.
    # This is an absolute path on the Docker host (normally the LXC host).
    env_file:
      - ${BEARBIZ_ENV_FILE:-/opt/bearbiz.env}
    environment:
      DJANGO_SETTINGS_MODULE: bearbiz.settings
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PGHOST: db
      PGPORT: "5432"
      # Keep these container paths independent of host env-file values.
      BACKUP_ROOT: /backups/bearbiz
      BACKUP_LOCK_FILE: /backups/bearbiz/backup.lock
      BACKUP_EXECUTION_MODE: direct
    volumes:
      - /opt/bearbiz/media:/app/media
      - /opt/bearbiz/backups:/backups/bearbiz
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16
    # POSTGRES_* credentials come from the host env_file below.
    env_file:
      - ${BEARBIZ_ENV_FILE:-/opt/bearbiz.env}
    volumes:
      - bearbiz_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bearbiz_postgres:
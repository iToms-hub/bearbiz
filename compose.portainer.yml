services:
  web:
    image: "ghcr.io/itoms-hub/bearbiz:1.1.0"
    command: sh -c "python manage.py migrate --noinput && gunicorn bearbiz.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}"
    environment:
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in the Portainer stack environment}"
      DEBUG: "${DEBUG:-0}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in the Portainer stack environment}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in the Portainer stack environment}"
      DJANGO_SETTINGS_MODULE: bearbiz.settings
      POSTGRES_DB: "${POSTGRES_DB:-bearbiz}"
      POSTGRES_USER: "${POSTGRES_USER:-bearbiz}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Portainer stack environment}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PGHOST: db
      PGPORT: "5432"
      BACKUP_ROOT: /backups/bearbiz
      BACKUP_LOCK_FILE: /backups/bearbiz/backup.lock
      BACKUP_EXECUTION_MODE: direct
      BACKUP_STORAGE_MODE: named-volume
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-Not configured - run manually; named-volume storage is not off-host}"
      BACKUP_OWNER_UID: "${BACKUP_OWNER_UID:-1000}"
      BACKUP_OWNER_GID: "${BACKUP_OWNER_GID:-1000}"
    volumes:
      - bearbiz_media:/app/media
      - bearbiz_backups:/backups/bearbiz
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bearbiz}"
      POSTGRES_USER: "${POSTGRES_USER:-bearbiz}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the Portainer stack environment}"
    volumes:
      - bearbiz_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bearbiz_postgres:
    name: bearbiz_postgres
  bearbiz_media:
    name: bearbiz_media
  bearbiz_backups:
    name: bearbiz_backups

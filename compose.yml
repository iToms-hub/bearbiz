services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: bearbiz.settings
      SECRET_KEY: dev-only-secret-key
      DEBUG: "1"
      POSTGRES_DB: bearbiz
      POSTGRES_USER: bearbiz
      POSTGRES_PASSWORD: bearbiz
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bearbiz
      POSTGRES_USER: bearbiz
      POSTGRES_PASSWORD: bearbiz
    volumes:
      - bearbiz_postgres:/var/lib/postgresql/data

volumes:
  bearbiz_postgres:

services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: bearbiz.settings
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      POSTGRES_DB: ${POSTGRES_DB:-bearbiz}
      POSTGRES_USER: ${POSTGRES_USER:-bearbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bearbiz}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-bearbiz}
      PGUSER: ${POSTGRES_USER:-bearbiz}
      PGPASSWORD: ${POSTGRES_PASSWORD:-bearbiz}
      BACKUP_ROOT: /backups/bearbiz
      BACKUP_LOCK_FILE: /backups/bearbiz/backup.lock
      BACKUP_EXECUTION_MODE: direct
      BACKUP_OWNER_UID: ${BACKUP_OWNER_UID:-1000}
      BACKUP_OWNER_GID: ${BACKUP_OWNER_GID:-1000}
    volumes:
      - .:/app
      - ${BACKUP_ROOT:-/home/tome/backups/bearbiz}:/backups/bearbiz
    ports:
      - "${WEB_PORT:-8002}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bearbiz}
      POSTGRES_USER: ${POSTGRES_USER:-bearbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bearbiz}
    volumes:
      - bearbiz_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bearbiz_postgres:

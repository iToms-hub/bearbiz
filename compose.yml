services:
  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: bearbiz.settings
      DEBUG: ${DEBUG:-1}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-key}
      POSTGRES_DB: ${POSTGRES_DB:-bearbiz}
      POSTGRES_USER: ${POSTGRES_USER:-bearbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bearbiz}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bearbiz}
      POSTGRES_USER: ${POSTGRES_USER:-bearbiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bearbiz}
    volumes:
      - bearbiz_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  bearbiz_postgres:

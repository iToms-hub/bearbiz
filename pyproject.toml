[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bearbiz"
version = "0.0.1"
description = "Bearbiz BI platform for weekly PDF report ingestion and dashboards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<6.0",
  "psycopg[binary]>=3.2,<4.0",
  "gunicorn>=23,<24",
  "pdfplumber>=0.11,<0.12",
  "PyMuPDF>=1.24,<2.0",
  "weasyprint>=62,<63",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["bearbiz*", "apps*"]

<div class="table-wrap"><table class="report-grid"><thead><tr>{% for header in headers %}<th>{{ header }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr class="{{ row.row_class|default:'' }}">{% for value in row.values %}<td>{{ value }}</td>{% endfor %}</tr>{% empty %}<tr><td colspan="10" class="muted">No persisted data available.</td></tr>{% endfor %}</tbody></table></div>
